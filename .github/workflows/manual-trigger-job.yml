name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
    - name: Install az ml extension
      run: az extension add -n ml -y --upgrade
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Run Azure Machine Learning training job
      run: |
        JOB_NAME=$(az ml job create -f src/job.yml \
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
          --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }} \
          --query name -o tsv)
        echo "Job: $JOB_NAME"
        az ml job stream -n $JOB_NAME \
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
          --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }} || true
        STATUS=$(az ml job show -n $JOB_NAME \
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
          --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }} \
          --query status -o tsv)
        echo "Status: $STATUS"
        [ "$STATUS" = "Completed" ]